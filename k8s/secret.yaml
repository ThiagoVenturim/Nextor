apiVersion: v1
kind: Secret
metadata:
  name: nextor-secret
  labels:
    app.kubernetes.io/name: nextor
type: Opaque
stringData:
  # Substitua pelo seu token seguro e URL de conexao antes de aplicar no cluster
  NEXTOR_TOKEN: "gere-um-token-seguro-com-pelo-menos-24-caracteres"
  DB_URL: "postgresql+psycopg://nextor:changeme@postgres:5432/nextor"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextor
  labels:
    app.kubernetes.io/name: nextor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: nextor
          image: ghcr.io/thiagoventurim/nextor:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nextor-config
            - secretRef:
                name: nextor-secret
          ports:
            - name: http
              containerPort: 5005
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextor"
version = "0.1.0"
description = "Assistente pessoal inteligente e local com GTD, coach de estudos e automacoes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "python-dotenv",
    "gTTS",
    "catt",
    "icalendar",
    "recurring_ical_events",
    "feedparser",
    "anthropic",
    "mcp[cli]",
    "pypdf",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0",
]
mysql = [
    "pymysql>=1.1.0",
    "cryptography>=41.0.0",
]
mssql = [
    "pyodbc>=5.0.0",
]
odbc = [
    "pyodbc>=5.0.0",
]
all-databases = [
    "psycopg[binary]>=3.1.0",
    "pymysql>=1.1.0",
    "pyodbc>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
qr = [
    "segno>=1.5",
]
push = [
    "pywebpush>=1.14",
]

[tool.setuptools.packages.find]
include = ["nextor*"]

[tool.setuptools.package-data]
nextor = ["web/*", "web/**/*", "coach/trilhas/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
